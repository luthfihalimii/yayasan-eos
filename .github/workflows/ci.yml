name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: eos_dev
          POSTGRES_DB: eos
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://eos_app:eos_app_dev@127.0.0.1:5433/eos?schema=public
      MIGRATOR_DATABASE_URL: postgresql://eos_migrator:eos_migrator_dev@127.0.0.1:5433/eos?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci-only-not-a-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Role split WAJIB sebelum migrate — test yang jalan sebagai owner
      # tidak membuktikan RLS apa-apa (AGENTS.md §11).
      - name: Init database roles (eos_migrator / eos_app)
        run: psql "postgresql://postgres:eos_dev@127.0.0.1:5433/eos" -v ON_ERROR_STOP=1 -f infra/init-roles.sql

      - name: Migrate (as eos_migrator)
        working-directory: apps/api
        run: npx prisma migrate deploy

      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate

      - name: Typecheck
        working-directory: apps/api
        run: npx tsc -p tsconfig.json --noEmit

      - name: Test (as eos_app)
        working-directory: apps/api
        run: npx vitest run
